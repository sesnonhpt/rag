server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location ~ ^/(health|client-config|chat|traces|lesson-template-categories|lesson-history|lesson-plan|lesson-plan-image|ppt-decks|ppt|experimental|docs|redoc|openapi\.json|documents) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ ^/templates/(list|download/.*|download-export/.*|ai-modify|extract-teaching-thoughts|analyze-lesson-stream|course-to-draft/stream|index|.+/content|.+/versions|.+/versions/[^/]+/restore|.+/export|.+/pilot-package|.+/metadata|.+/index)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
