name: Deploy Full Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://your-api-domain.com' }}
          VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL || 'wss://your-api-domain.com' }}
        run: npm run build
      
  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Repository to Server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          rsync -az --delete \
            --filter "P .env" \
            --filter "P data/db/" \
            --filter "P data/images/" \
            --filter "P data/temp_uploads/" \
            --filter "P data/processing_history.json" \
            --exclude ".git" \
            --exclude ".env" \
            --exclude ".venv" \
            --exclude "venv" \
            --exclude "node_modules" \
            --exclude "logs" \
            --exclude "data/db" \
            --exclude "data/images" \
            --exclude "data/temp_uploads" \
            --exclude "data/processing_history.json" \
            --exclude "frontend/dist" \
            -e "ssh -p ${DEPLOY_PORT:-22}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_APP_DIR:-/home/ubuntu/apps/rag}/"

      - name: Deploy on Server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail && \
             APP_DIR='${DEPLOY_APP_DIR:-/home/ubuntu/apps/rag}' && \
             test -d \"\$APP_DIR\" && \
             APP_DIR=\"\$APP_DIR\" BRANCH='${DEPLOY_BRANCH:-main}' SKIP_GIT_SYNC=true bash \"\$APP_DIR/scripts/deploy_fullstack.sh\""
