name: Deploy Frontend Only

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-only.yml'

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install Dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build Frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://your-api-domain.com' }}
          VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL || 'wss://your-api-domain.com' }}
        run: npm run build
      
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync Frontend to Server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
        run: |
          ssh \
            -p "${DEPLOY_PORT:-22}" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -o TCPKeepAlive=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_APP_DIR:-/home/ubuntu/apps/rag}/frontend'"

          rsync -az --delete \
            --exclude "node_modules" \
            --exclude "dist" \
            -e "ssh -p ${DEPLOY_PORT:-22} -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes" \
            ./frontend/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_APP_DIR:-/home/ubuntu/apps/rag}/frontend/"

      - name: Deploy Frontend on Server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          ssh \
            -p "${DEPLOY_PORT:-22}" \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            -o TCPKeepAlive=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -euo pipefail && \
             APP_DIR='${DEPLOY_APP_DIR:-/home/ubuntu/apps/rag}' && \
             test -d \"\$APP_DIR\" && \
             APP_DIR=\"\$APP_DIR\" BRANCH='${DEPLOY_BRANCH:-main}' SKIP_GIT_SYNC=true bash \"\$APP_DIR/scripts/deploy_frontend.sh\""
